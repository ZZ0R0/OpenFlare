# OpenFlare Edge Proxy - Development Configuration
server:
  listen_addr: ":8080"
  admin_listen_addr: ":8081"
  read_timeout_ms: 5000
  write_timeout_ms: 10000
  idle_timeout_ms: 60000
  max_header_bytes: 1048576
  graceful_shutdown_timeout_ms: 15000

upstreams:
  - name: testsite
    base_url: "http://testsite:8000"
    connect_timeout_ms: 2000
    response_header_timeout_ms: 5000
    max_idle_conns: 100
    max_idle_conns_per_host: 50

routing:
  default_upstream: "testsite"

security:
  trust_x_forwarded_for: false
  max_body_inspect_bytes: 65536
  max_request_body_bytes: 10485760

cache:
  enabled: true
  max_entries: 5000
  max_bytes: 268435456
  default_ttl_seconds: 30
  respect_origin_cache_control: true
  bypass_on_cookie: true
  bypass_on_authorization: true
  never_store_on_set_cookie: true
  debug_headers: true

admin_api:
  enabled: true
  auth_token: "change-me"

logging:
  level: "info"
  format: "json"
