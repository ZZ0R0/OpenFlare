[pytest]
testpaths = tests
timeout = 30
markers =
    cache: Cache tests
    waf: WAF tests
    ratelimit: Rate limiting tests
    robustness: Upstream robustness tests
    admin: Admin API tests
    metrics: Metrics / health tests
    normalization: Normalization / bypass tests
    concurrency: Concurrency smoke tests
log_cli = true
log_cli_level = INFO
